name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:demo
      - run: npm run build
      - run: npm run pack
      - run: npm ci --prefix cloudflare
      - run: npm run typecheck --prefix cloudflare
      - run: npm exec --prefix cloudflare wrangler -- deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/agentready-edge
      - run: npm exec --prefix cloudflare wrangler -- deploy --dry-run --config cloudflare/wrangler.payments.jsonc --outdir /tmp/agentready-payments
      - run: npm exec --prefix cloudflare wrangler -- deploy --dry-run --config cloudflare/wrangler.crawl.jsonc --outdir /tmp/agentready-crawl
